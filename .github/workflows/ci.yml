name: Assignment Portal CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-json-report

      - name: Run tests and send report
        env:
          REPORT_URL: http://127.0.0.1:5001/report
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        shell: powershell
        run: |
          python -m pytest -v --json-report --json-report-file=pytest-report.json
          $testExitCode = $LASTEXITCODE

          python scripts/send_report.py
          $reportExitCode = $LASTEXITCODE

          if ($reportExitCode -ne 0) {
              exit $reportExitCode
          }

          exit $testExitCode

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Assignment Portal Test Report - ${{ job.status }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Assignment Portal CI test report.

            Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

            View complete workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          attachments: pytest-report.json
