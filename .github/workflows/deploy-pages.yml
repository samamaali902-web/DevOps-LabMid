name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest-json-report

      - name: Run tests
        env:
          REPORT_URL: http://127.0.0.1:5001/report
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        shell: powershell
        run: |
          python -m pytest -v --json-report --json-report-file=pytest-report.json
          $testExitCode = $LASTEXITCODE
          python scripts/send_report.py
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          exit $testExitCode

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: success()
        uses: actions/deploy-pages@v4
